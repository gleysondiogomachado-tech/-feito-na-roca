<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Feito na Roça">
<title>Feito na Roça</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f1e8;
  color:#253125
}

header{
  background:#2f6b3b;
  color:#fff;
  padding:18px 14px;
  position:sticky;
  top:0;
  z-index:5
}

header h1{
  margin:0;
  font-size:25px
}

header p{
  margin:4px 0 0;
  font-size:13px
}

nav{
  display:flex;
  overflow:auto;
  background:#fff;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:78px;
  z-index:4
}

nav button{
  border:0;
  background:#fff;
  padding:13px 15px;
  white-space:nowrap;
  font-weight:bold;
  color:#315f3a
}

nav button.active{
  background:#e8f0e8;
  border-bottom:3px solid #2f6b3b
}

main{
  max-width:850px;
  margin:auto;
  padding:14px
}

section{
  display:none
}

.active-section{
  display:block
}

.card{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin:12px 0;
  box-shadow:0 2px 8px #00000012
}

h2{
  margin:4px 0 12px
}

.grid{
  display:grid;
  gap:10px
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px
}

button.action{
  border:0;
  border-radius:9px;
  padding:11px 14px;
  background:#2f6b3b;
  color:white;
  font-weight:bold;
  cursor:pointer
}

button.secondary{
  background:#e8eee8;
  color:#24532e
}

button.danger{
  background:#a33b32
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap
}

.between{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center
}

.product{
  border:1px solid #ddd;
  border-radius:12px;
  padding:13px
}

.product h3{
  margin:0 0 5px
}

.price{
  font-weight:bold;
  font-size:18px
}

.qty{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:10px
}

.qty button{
  width:40px;
  height:40px;
  border:0;
  border-radius:9px;
  font-size:22px;
  background:#e1eadf;
  color:#24532e
}

.qty span{
  min-width:35px;
  text-align:center;
  font-weight:bold;
  font-size:18px
}

.total{
  font-size:22px;
  font-weight:bold;
  color:#2f6b3b
}

.muted{
  color:#667066;
  font-size:13px
}

.item-line{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #eee;
  padding:7px 0;
  gap:10px
}

.empty{
  padding:20px;
  text-align:center;
  color:#777
}

.alerta{
  background:#fff1c7;
  padding:12px;
  border-radius:10px;
  margin-top:10px
}

@media(max-width:600px){
  main{
    padding:10px
  }

  .products{
    grid-template-columns:1fr
  }

  .between{
    align-items:flex-start
  }
}
</style>
</head>

<body>

<header>
  <h1>🌾 Feito na Roça</h1>
  <p>Do campo para sua mesa</p>
</header>

<nav id="nav">
  <button data-tab="pedido" class="active">🛒 Pedido</button>
  <button data-tab="clientes">👤 Clientes</button>
  <button data-tab="estoque">📦 Estoque</button>
  <button data-tab="relatorios">📊 Relatórios</button>
  <button data-tab="contas">💰 Contas</button>
</nav>

<main>

<!-- PEDIDOS -->
<section id="pedido" class="active-section">

  <div class="card">
    <h2>Novo pedido</h2>

    <label>Cliente</label>
    <select id="clienteSelect"></select>

    <div class="row" style="margin-top:8px">

      <button
        class="action secondary"
        onclick="novoClienteRapido()">
        + Novo cliente
      </button>

      <button
        id="audioBtn"
        class="action secondary"
        onclick="alternarAudio()">
        🔊 Áudio: ligado
      </button>

      <button
        class="action secondary"
        onclick="falar('Áudio do Feito na Roça funcionando.')">
        🔊 Testar áudio
      </button>

    </div>
  </div>

  <div class="card">
    <h2>Produtos</h2>
    <div id="listaProdutos" class="products"></div>
  </div>

  <div class="card">

    <div class="between">
      <span>Total do pedido</span>
      <span id="totalPedido" class="total">
        R$ 0,00
      </span>
    </div>

    <div class="row" style="margin-top:12px">

      <button
        class="action"
        onclick="salvarPedido()">
        Salvar pedido
      </button>

      <button
        class="action secondary"
        onclick="limparCarrinho()">
        Limpar
      </button>

    </div>

  </div>

</section>


<!-- CLIENTES -->
<section id="clientes">

  <div class="card">

    <h2>Clientes</h2>

    <div class="grid">

      <div class="row">

        <input
          id="nomeCliente"
          placeholder="Nome do cliente">

        <button
          class="action secondary"
          onclick="ouvirCampo('nomeCliente','Diga o nome do cliente')">
          🎤
        </button>

      </div>

      <div class="row">

        <input
          id="telefoneCliente"
          placeholder="Telefone">

        <button
          class="action secondary"
          onclick="ouvirCampo('telefoneCliente','Diga o telefone')">
          🎤
        </button>

      </div>

      <div class="row">

        <input
          id="enderecoCliente"
          placeholder="Endereço">

        <button
          class="action secondary"
          onclick="ouvirCampo('enderecoCliente','Diga o endereço')">
          🎤
        </button>

      </div>

      <button
        class="action"
        onclick="salvarCliente()">
        Salvar cliente
      </button>

    </div>

  </div>

  <div id="listaClientes" class="card"></div>

</section>


<!-- ESTOQUE -->
<section id="estoque">

  <div class="card">

    <h2>Estoque</h2>

    <div id="listaEstoque"></div>

  </div>

</section>


<!-- RELATÓRIOS -->
<section id="relatorios">

  <div class="card">

    <h2>Relatório</h2>

    <div id="relatorio"></div>

  </div>

</section>


<!-- CONTAS -->
<section id="contas">

  <div class="card">

    <h2>Contas a receber</h2>

    <div id="listaContas"></div>

  </div>

</section>

</main>


<script>

/* =========================================================
   BANCO LOCAL
   ========================================================= */

const KEY = {
  prod:"fr_produtos_v3",
  cli:"fr_clientes_v3",
  ped:"fr_pedidos_v3",
  con:"fr_contas_v3",
  est:"fr_estoque_v3"
};


/* =========================================================
   PRODUTOS
   ========================================================= */

const produtosPadrao = [

  ["p1","Queijo fresco",40,20],

  ["p2","Queijo curado",45,20],

  ["p3","Mussarela",50,20],

  ["p4","Requeijão duro",55,20],

  ["p5","Pão de queijo pequeno (1 kg)",28,20],

  ["p6","Pão de queijo grande (1 kg)",27,20],

  ["p7","Rosca caseira",12,20],

  ["p8","Doce de leite caseiro 200g",12,20],

  ["p9","Doce de leite 500g",30,20]

].map(x => ({

  id:x[0],

  nome:x[1],

  preco:x[2],

  estoque:x[3]

}));


/* =========================================================
   LEITURA E GRAVAÇÃO
   ========================================================= */

function get(k,def=[]){

  try{

    return JSON.parse(
      localStorage.getItem(k)
    ) ?? def;

  }catch(e){

    return def;

  }

}


function set(k,v){

  localStorage.setItem(
    k,
    JSON.stringify(v)
  );

}


/* =========================================================
   DADOS
   ========================================================= */

let produtos =
  get(KEY.prod,produtosPadrao);

let clientes =
  get(KEY.cli,[]);

let pedidos =
  get(KEY.ped,[]);

let contas =
  get(KEY.con,[]);

let carrinho = {};

let clienteAtual = "";


/* =========================================================
   FUNÇÕES AUXILIARES
   ========================================================= */

function moeda(v){

  return Number(v || 0).toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL"
    }
  );

}


function esc(s){

  return String(s ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}


function id(prefix){

  return prefix +
    "_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2,8);

}


/* =========================================================
   ÁUDIO
   ========================================================= */

let audioAtivo =
  localStorage.getItem("fr_audio_ativo") !== "0";


function atualizarBotaoAudio(){

  const b =
    document.getElementById("audioBtn");

  if(b){

    b.textContent =
      audioAtivo
      ? "🔊 Áudio: ligado"
      : "🔇 Áudio: desligado";

  }

}


function alternarAudio(){

  audioAtivo = !audioAtivo;

  localStorage.setItem(
    "fr_audio_ativo",
    audioAtivo ? "1" : "0"
  );

  atualizarBotaoAudio();

  if(audioAtivo){

    falar("Áudio ligado.");

  }

}


function ouvirCampo(idCampo,prompt){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SR){

    alert(
      "O reconhecimento de voz não está disponível neste navegador. Use o Chrome e permita o microfone."
    );

    return;

  }

  const r = new SR();

  r.lang = "pt-BR";

  r.interimResults = false;

  r.maxAlternatives = 1;

  try{

    r.start();

  }catch(e){

    return;

  }

  r.onresult = e => {

    document.getElementById(
      idCampo
    ).value =
      e.results[0][0].transcript;

  };

  r.onerror = e => {

    if(e.error === "not-allowed"){

      alert(
        "Permita o acesso ao microfone para usar a voz."
      );

    }

  };

}


function falar(t){

  if(!audioAtivo) return;

  if(!("speechSynthesis" in window)){

    alert(
      "Seu navegador não disponibiliza áudio de voz."
    );

    return;

  }

  speechSynthesis.cancel();

  const u =
    new SpeechSynthesisUtterance(t);

  u.lang = "pt-BR";

  u.rate = .95;

  u.pitch = 1;

  speechSynthesis.speak(u);

}


/* =========================================================
   CLIENTES NO PEDIDO
   ========================================================= */

function renderClientesSelect(){

  const s =
    document.getElementById(
      "clienteSelect"
    );

  s.innerHTML =
    '<option value="">Selecione o cliente</option>' +
    clientes.map(c =>
      `<option value="${c.id}">
        ${esc(c.nome)}
      </option>`
    ).join("");

  s.value = clienteAtual;

}


/* =========================================================
   PRODUTOS
   ========================================================= */

function renderProdutos(){

  const el =
    document.getElementById(
      "listaProdutos"
    );

  el.innerHTML =
    produtos.map(p => {

      /*
       IMPORTANTE:
       cada produto usa seu próprio ID
       no carrinho.
      */

      const q =
        Number(
          carrinho[p.id] || 0
        );

      return `

        <div class="product">

          <h3>
            ${esc(p.nome)}
          </h3>

          <div class="price">
            ${moeda(p.preco)}
          </div>

          <div class="muted">
            Estoque: ${p.estoque}
          </div>

          <div class="qty">

            <button
              onclick="alterarQtd('${p.id}',-1)">
              −
            </button>

            <span>
              ${q}
            </span>

            <button
              onclick="alterarQtd('${p.id}',1)">
              +
            </button>

          </div>

        </div>

      `;

    }).join("");

  atualizarTotal();

}


/* =========================================================
   QUANTIDADE INDEPENDENTE
   ========================================================= */

function alterarQtd(pid,delta){

  const p =
    produtos.find(
      x => x.id === pid
    );

  if(!p) return;

  const atual =
    Number(
      carrinho[pid] || 0
    );

  const novo =
    Math.max(
      0,
      Math.min(
        p.estoque,
        atual + delta
      )
    );

  carrinho[pid] = novo;

  renderProdutos();

}


/* =========================================================
   TOTAL DO PEDIDO
   ========================================================= */

function atualizarTotal(){

  let total = 0;

  produtos.forEach(p => {

    total +=
      Number(
        carrinho[p.id] || 0
      ) *
      Number(
        p.preco || 0
      );

  });

  document.getElementById(
    "totalPedido"
  ).textContent =
    moeda(total);

}


function limparCarrinho(){

  carrinho = {};

  renderProdutos();

}


/* =========================================================
   NOVO CLIENTE
   ========================================================= */

function novoClienteRapido(){

  document
    .querySelector(
      '[data-tab="clientes"]'
    )
    .click();

  document
    .getElementById("nomeCliente")
    .focus();

}


/* =========================================================
   SALVAR CLIENTE
   ========================================================= */

function salvarCliente(){

  const nome =
    document
      .getElementById(
        "nomeCliente"
      )
      .value
      .trim();

  if(!nome){

    alert(
      "Digite o nome do cliente."
    );

    return;

  }

  const c = {

    id:id("cli"),

    nome:nome,

    telefone:
      document
        .getElementById(
          "telefoneCliente"
        )
        .value
        .trim(),

    endereco:
      document
        .getElementById(
          "enderecoCliente"
        )
        .value
        .trim()

  };


  clientes.push(c);

  set(
    KEY.cli,
    clientes
  );

  clienteAtual = c.id;


  document.getElementById(
    "nomeCliente"
  ).value = "";

  document.getElementById(
    "telefoneCliente"
  ).value = "";

  document.getElementById(
    "enderecoCliente"
  ).value = "";


  renderAll();


  document
    .querySelector(
      '[data-tab="pedido"]'
    )
    .click();


  falar(
    "Cliente salvo com sucesso."
  );

}


/* =========================================================
   SALVAR PEDIDO
   ========================================================= */

function salvarPedido(){

  if(!clienteAtual){

    alert(
      "Selecione um cliente."
    );

    return;

  }


  const itens =
    produtos
      .filter(
        p =>
          Number(
            carrinho[p.id] || 0
          ) > 0
      )
      .map(p => ({

        produtoId:p.id,

        nome:p.nome,

        quantidade:
          Number(
            carrinho[p.id]
          ),

        preco:
          Number(
            p.preco
          ),

        subtotal:
          Number(
            carrinho[p.id]
          ) *
          Number(
            p.preco
          )

      }));


  if(!itens.length){

    alert(
      "Adicione pelo menos um produto."
    );

    return;

  }


  const cliente =
    clientes.find(
      c =>
        c.id === clienteAtual
    );


  const total =
    itens.reduce(
      (a,b) =>
        a + b.subtotal,
      0
    );


  const pedido = {

    id:id("ped"),

    clienteId:
      cliente.id,

    clienteNome:
      cliente.nome,

    data:
      new Date().toISOString(),

    itens:itens,

    total:total,

    pago:false

  };


  pedidos.push(pedido);

  set(
    KEY.ped,
    pedidos
  );


  /*
   Desconta do estoque
  */

  itens.forEach(i => {

    const p =
      produtos.find(
        x =>
          x.id ===
          i.produtoId
      );

    if(p){

      p.estoque =
        Math.max(
          0,
          p.estoque -
          i.quantidade
        );

    }

  });


  set(
    KEY.prod,
    produtos
  );


  /*
   Cria a conta do cliente
  */

  contas.push({

    id:id("con"),

    pedidoId:
      pedido.id,

    clienteId:
      cliente.id,

    clienteNome:
      cliente.nome,

    data:
      pedido.data,

    valor:
      total,

    pago:false

  });


  set(
    KEY.con,
    contas
  );


  carrinho = {};


  renderAll();


  falar(
    `Pedido salvo com sucesso. Cliente ${cliente.nome}. Total ${moeda(total)}.`
  );

}


/* =========================================================
   CLIENTES
   ========================================================= */

function renderClientes(){

  const el =
    document.getElementById(
      "listaClientes"
    );


  if(!clientes.length){

    el.innerHTML =
      '<div class="empty">Nenhum cliente cadastrado.</div>';

    return;

  }


  el.innerHTML =
    clientes.map(c => `

      <div class="item-line">

        <div>

          <b>
            ${esc(c.nome)}
          </b>

          <div class="muted">
            ${esc(c.telefone || "")}
            ${c.endereco
              ? " • " + esc(c.endereco)
              : ""}
          </div>

        </div>

        <button
          class="action secondary"
          onclick="selecionarCliente('${c.id}')">
          Usar
        </button>

      </div>

    `).join("");

}


function selecionarCliente(idc){

  clienteAtual = idc;

  renderClientesSelect();

  document
    .querySelector(
      '[data-tab="pedido"]'
    )
    .click();

}


/* =========================================================
   ESTOQUE
   ========================================================= */

function renderEstoque(){

  document.getElementById(
    "listaEstoque"
  ).innerHTML =

    produtos.map(p => {

      let alerta = "";

      if(
        Number(p.estoque) <= 3
      ){

        alerta = `
          <div class="alerta">
            ⚠️ Estoque baixo
          </div>
        `;

      }

      return `

        <div class="item-line">

          <span>
            <b>
              ${esc(p.nome)}
            </b>

            ${alerta}

          </span>

          <b>
            ${p.estoque}
          </b>

        </div>

      `;

    }).join("");

}


/* =========================================================
   CONTAS
   ========================================================= */

function renderContas(){

  const el =
    document.getElementById(
      "listaContas"
    );


  if(!contas.length){

    el.innerHTML =
      '<div class="empty">Nenhuma conta.</div>';

    return;

  }


  el.innerHTML =
    contas
      .slice()
      .reverse()
      .map(c => `

        <div class="item-line">

          <div>

            <b>
              ${esc(c.clienteNome)}
            </b>

            <div>
              ${moeda(c.valor)}
              •
              ${new Date(c.data)
                .toLocaleDateString(
                  "pt-BR"
                )}
            </div>

          </div>

          <button
            class="action ${c.pago ? "secondary" : ""}"
            onclick="alternarPago('${c.id}')">

            ${c.pago
              ? "Paga"
              : "Marcar paga"}

          </button>

        </div>

      `)
      .join("");

}


function alternarPago(cid){

  const c =
    contas.find(
      x =>
        x.id === cid
    );

  if(!c) return;

  c.pago = !c.pago;

  set(
    KEY.con,
    contas
  );

  renderContas();

  falar(
    c.pago
      ? "Conta marcada como paga."
      : "Conta reaberta."
  );

}


/* =========================================================
   RELATÓRIO
   ========================================================= */

function renderRelatorio(){

  const total =
    pedidos.reduce(
      (a,p) =>
        a +
        Number(
          p.total || 0
        ),
      0
    );


  const aberto =
    contas
      .filter(
        c =>
          !c.pago
      )
      .reduce(
        (a,c) =>
          a +
          Number(
            c.valor || 0
          ),
        0
      );


  const pagos =
    contas
      .filter(
        c =>
          c.pago
      )
      .reduce(
        (a,c) =>
          a +
          Number(
            c.valor || 0
          ),
        0
      );


  let html = `

    <p>
      <b>Pedidos:</b>
      ${pedidos.length}
    </p>

    <p>
      <b>Vendas:</b>
      ${moeda(total)}
    </p>

    <p>
      <b>Recebido:</b>
      ${moeda(pagos)}
    </p>

    <p>
      <b>A receber:</b>
      ${moeda(aberto)}
    </p>

  `;


  html +=
    pedidos
      .slice()
      .reverse()
      .map(p => `

        <div class="card">

          <div class="between">

            <b>
              ${esc(p.clienteNome)}
            </b>

            <b>
              ${moeda(p.total)}
            </b>

          </div>

          <div class="muted">

            ${new Date(p.data)
              .toLocaleString(
                "pt-BR"
              )}

          </div>

          ${p.itens.map(i => `

            <div class="item-line">

              <span>
                ${i.quantidade}x
                ${esc(i.nome)}
              </span>

              <span>
                ${moeda(i.subtotal)}
              </span>

            </div>

          `).join("")}

        </div>

      `)
      .join("");


  document.getElementById(
    "relatorio"
  ).innerHTML = html;

}


/* =========================================================
   ATUALIZA TUDO
   ========================================================= */

function renderAll(){

  renderClientesSelect();

  renderProdutos();

  renderClientes();

  renderEstoque();

  renderContas();

  renderRelatorio();

}


/* =========================================================
   NAVEGAÇÃO
   ========================================================= */

document
  .querySelectorAll(
    "nav button"
  )
  .forEach(b => {

    b.onclick = () => {

      document
        .querySelectorAll(
          "nav button"
        )
        .forEach(x =>
          x.classList.remove(
            "active"
          )
        );


      document
        .querySelectorAll(
          "main section"
        )
        .forEach(x =>
          x.classList.remove(
            "active-section"
          )
        );


      b.classList.add(
        "active"
      );


      document
        .getElementById(
          b.dataset.tab
        )
        .classList.add(
          "active-section"
        );

    };

  });


/* =========================================================
   CLIENTE SELECIONADO
   ========================================================= */

document
  .getElementById(
    "clienteSelect"
  )
  .onchange = e => {

    clienteAtual =
      e.target.value;

  };


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

renderAll();

atualizarBotaoAudio();

</script>

</body>
</html>
