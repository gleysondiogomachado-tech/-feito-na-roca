<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b3f">
<title>Feito na Roça</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f1e8;
  color:#263126
}

header{
  background:#2f6b3f;
  color:#fff;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:5
}

header h1{
  margin:0;
  font-size:24px
}

header small{
  opacity:.9
}

nav{
  display:flex;
  gap:7px;
  overflow:auto;
  padding:10px;
  background:#fff;
  position:sticky;
  top:73px;
  z-index:4;
  border-bottom:1px solid #ddd
}

nav button{
  border:0;
  background:#e8efe8;
  color:#285b34;
  padding:10px 12px;
  border-radius:10px;
  font-weight:bold;
  white-space:nowrap
}

nav button.active{
  background:#2f6b3f;
  color:white
}

main{
  max-width:1000px;
  margin:auto;
  padding:14px
}

section{
  display:none
}

.show{
  display:block
}

.card{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin:10px 0;
  box-shadow:0 2px 8px #00000012
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px
}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
  background:#fff
}

label{
  font-size:13px;
  font-weight:bold;
  display:block;
  margin:8px 0 5px
}

button.primary,.primary{
  background:#2f6b3f;
  color:white;
  border:0;
  border-radius:9px;
  padding:11px 14px;
  font-weight:bold
}

button.danger{
  background:#b3261e;
  color:#fff;
  border:0;
  border-radius:8px;
  padding:8px
}

button.secondary{
  background:#eee;
  border:0;
  border-radius:8px;
  padding:9px
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px
}

th,td{
  padding:9px;
  border-bottom:1px solid #ddd;
  text-align:left
}

th{
  background:#f1f4f0
}

.total{
  font-size:22px;
  font-weight:bold;
  color:#2f6b3f
}

.warn{
  color:#a35a00;
  font-weight:bold
}

.debt{
  color:#b3261e;
  font-weight:bold
}

.ok{
  color:#2f6b3f;
  font-weight:bold
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap
}

.report-total{
  background:#f1f4f0;
  border-radius:12px;
  padding:14px;
  margin-top:12px
}

.report-total div{
  margin:6px 0
}

.small{
  font-size:13px;
  color:#666
}

.pill{
  padding:4px 8px;
  border-radius:20px;
  background:#eee;
  font-size:12px
}

.qty-control{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%
}

.qty-control button{
  width:46px;
  height:46px;
  border:0;
  border-radius:10px;
  background:#e8efe8;
  color:#285b34;
  font-size:28px;
  font-weight:bold;
  line-height:1
}

.qty-control input{
  text-align:center;
  font-size:20px;
  font-weight:bold;
  margin:0
}

.sale-preview{
  margin-top:10px;
  padding:12px;
  border-radius:10px;
  background:#f1f4f0;
  font-weight:bold;
  text-align:center
}

@media print{
  nav,header,.no-print{
    display:none!important
  }

  section{
    display:none
  }

  .print-area{
    display:block!important
  }

  .card{
    box-shadow:none
  }
}
</style>
</head>

<body>

<header>
<h1>🌾 Feito na Roça</h1>
<small>Clientes • Pedidos • Contas • Estoque • Relatórios</small>
</header>

<nav id="nav">
<button data-tab="inicio">Início</button>
<button data-tab="clientes">Clientes</button>
<button data-tab="pedidos">Pedidos</button>
<button data-tab="contas">Contas</button>
<button data-tab="estoque">Estoque</button>
<button data-tab="relatorios">Relatórios</button>
</nav>

<main>

<section id="inicio" class="show">

<div class="grid">

<div class="card">
<div class="small">Clientes</div>
<div class="total" id="kClientes">0</div>
</div>

<div class="card">
<div class="small">Pedidos</div>
<div class="total" id="kPedidos">0</div>
</div>

<div class="card">
<div class="small">A receber</div>
<div class="total" id="kReceber">R$ 0,00</div>
</div>

<div class="card">
<div class="small">Estoque baixo</div>
<div class="total" id="kEstoque">0</div>
</div>

</div>

<div class="card">
<h3>Resumo</h3>
<div id="homeList"></div>
</div>

</section>


<section id="clientes">

<div class="card">

<h2>Clientes</h2>

<div class="grid">

<div>
<label>Nome</label>
<input id="cNome" placeholder="Nome do cliente">
</div>

<div>
<label>Telefone</label>
<input id="cTel" placeholder="(00) 00000-0000">
</div>

<div>
<label>Observação</label>
<input id="cObs" placeholder="Observação">
</div>

</div>

<br>

<button class="primary" onclick="addCliente()">
Cadastrar cliente
</button>

</div>

<div class="card">

<input
id="buscaCliente"
oninput="renderClientes()"
placeholder="🔎 Procurar cliente"
>

<div id="listaClientes"></div>

</div>

</section>


<section id="pedidos">

<div class="card">

<h2>Novo pedido</h2>

<div class="grid">

<div>
<label>Cliente</label>
<select id="pCliente"></select>
</div>

<div>
<label>Produto</label>
<select id="pProduto"></select>
</div>

<div>

<label>Quantidade</label>

<div class="qty-control">

<button
type="button"
onclick="alterarQtd(-1)"
>−</button>

<input
id="pQtd"
type="number"
min="1"
step="1"
value="1"
oninput="normalizarQtd();atualizarTotalPedido()"
>

<button
type="button"
onclick="alterarQtd(1)"
>+</button>

</div>

<div
class="sale-preview"
id="pTotalPreview"
>
Total: R$ 0,00
</div>

</div>

<div>

<label>Preço unitário</label>

<input
id="pPreco"
type="number"
step="0.01"
>

</div>

</div>

<br>

<button
class="primary"
onclick="addPedido()"
>
Lançar pedido
</button>

</div>


<div class="card">

<h3>Pedidos</h3>

<div id="listaPedidos"></div>

</div>

</section>


<section id="contas">

<div class="card">

<h2>Conta do cliente</h2>

<div class="grid">

<div>

<label>Cliente</label>

<select
id="contaCliente"
onchange="renderConta()"
></select>

</div>

<div>

<label>Pagamento</label>

<input
id="pagValor"
type="number"
step="0.01"
min="0"
>

</div>

</div>

<br>

<button
class="primary"
onclick="registrarPagamento()"
>
Registrar pagamento
</button>

<button
class="secondary"
onclick="imprimirConta()"
>
Imprimir conta
</button>

</div>

<div id="contaResultado"></div>

</section>


<section id="estoque">

<div class="card">

<h2>Estoque</h2>

<div class="grid">

<div>

<label>Produto</label>

<select id="eProduto"></select>

</div>

<div>

<label>Quantidade atual</label>

<input
id="eQtd"
type="number"
step="0.01"
min="0"
>

</div>

<div>

<label>Estoque mínimo</label>

<input
id="eMin"
type="number"
step="0.01"
min="0"
value="3"
>

</div>

</div>

<br>

<button
class="primary"
onclick="salvarEstoque()"
>
Salvar estoque
</button>

</div>

<div
class="card"
id="estoqueLista"
></div>

</section>


<section id="relatorios">

<div class="card no-print">

<h2>Relatórios</h2>

<div class="grid">

<div>

<label>Cliente</label>

<select
id="rCliente"
onchange="renderRelatorio()"
></select>

</div>

<div>

<label>Tipo</label>

<select
id="rTipo"
onchange="renderRelatorio()"
>

<option value="conta">
Conta do cliente
</option>

<option value="clientes">
Todos os clientes
</option>

<option value="pedidos">
Pedidos
</option>

<option value="geral">
Resumo geral
</option>

</select>

</div>

</div>

<br>

<button
class="primary"
onclick="window.print()"
>
Imprimir / salvar PDF
</button>

</div>

<div
class="card print-area"
id="relatorioResultado"
></div>

</section>

</main>


<script>

const PRODUTOS = [

["Queijo fresco",40],

["Queijo curado",45],

["Requeijão duro",55],

["Pão de queijo pequeno (1 kg)",28],

["Pão de queijo grande (1 kg)",27],

["Rosca caseira",12],

["Doce de leite caseiro 200g",12],

["Doce de leite 500g",30],

["Muçarela",50]

];


const KEY = "feitoNaRoca_v2";


let db = JSON.parse(
localStorage.getItem(KEY) ||
'{"clientes":[],"pedidos":[],"pagamentos":[],"estoque":{}}'
);


function save(){

localStorage.setItem(
KEY,
JSON.stringify(db)
);

renderAll();

}


const brl = v =>
(Number(v)||0).toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);


function id(){

return Date.now() +
Math.random()
.toString(16)
.slice(2);

}


function esc(s){

return String(s ?? "")
.replace(
/[&<>"']/g,
m => ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}


function cliente(id){

return db.clientes.find(
c => c.id === id
);

}


function totalCliente(cid){

return db.pedidos
.filter(p => p.clienteId === cid)
.reduce(
(a,p) => a + p.total,
0
);

}


function pagoCliente(cid){

return db.pagamentos
.filter(p => p.clienteId === cid)
.reduce(
(a,p) => a + p.valor,
0
);

}


function saldoCliente(cid){

return totalCliente(cid) -
pagoCliente(cid);

}


function addCliente(){

let nome =
cNome.value.trim();

if(!nome){

alert("Informe o nome.");

return;

}

db.clientes.push({

id:id(),

nome:nome,

tel:cTel.value.trim(),

obs:cObs.value.trim(),

criado:new Date().toISOString()

});

cNome.value="";
cTel.value="";
cObs.value="";

save();

}


function excluirCliente(cid){

if(
!confirm(
"Excluir cliente e manter os lançamentos?"
)
)return;

db.clientes =
db.clientes.filter(
c => c.id !== cid
);

save();

}


function normalizarQtd(){

let q =
Math.floor(
Number(pQtd.value)||1
);

if(q < 1)
q = 1;

pQtd.value = q;

}


function alterarQtd(delta){

normalizarQtd();

pQtd.value =
Math.max(
1,
Number(pQtd.value) + delta
);

atualizarTotalPedido();

}


function atualizarTotalPedido(){

normalizarQtd();

let q =
Number(pQtd.value)||1;

let preco =
Number(pPreco.value)||0;

pTotalPreview.textContent =
"Total: " +
brl(q * preco);

}


function addPedido(){

normalizarQtd();

let cid =
pCliente.value;

let prod =
pProduto.value;

let q =
Number(pQtd.value);

let preco =
Number(pPreco.value);

if(
!cid ||
!prod ||
q < 1 ||
preco < 0
){

alert(
"Preencha cliente, produto, quantidade e preço."
);

return;

}

let total =
q * preco;


db.pedidos.push({

id:id(),

clienteId:cid,

produto:prod,

qtd:q,

preco:preco,

total:total,

data:new Date().toISOString()

});


save();

alert(
"Pedido lançado: " +
brl(total)
);

pQtd.value = 1;

atualizarTotalPedido();

}


function excluirPedido(pid){

db.pedidos =
db.pedidos.filter(
p => p.id !== pid
);

save();

}


function registrarPagamento(){

let cid =
contaCliente.value;

let v =
Number(pagValor.value);

if(!cid || v <= 0){

alert(
"Informe cliente e valor."
);

return;

}

db.pagamentos.push({

id:id(),

clienteId:cid,

valor:v,

data:new Date().toISOString()

});

pagValor.value="";

save();

renderConta();

}


function saldoStyle(s){

return s > 0.005

?

`<span class="debt">${brl(s)}</span>`

:

`<span class="ok">${brl(s)}</span>`;

}


function renderClientes(){

let q =
(buscaCliente.value || "")
.toLowerCase();


listaClientes.innerHTML =

db.clientes

.filter(
c =>
c.nome
.toLowerCase()
.includes(q)
)

.map(c => `

<div class="card">

<div class="row">

<div>

<b>
${esc(c.nome)}
</b>

<div class="small">
${esc(c.tel || "")}
</div>

</div>

<div>
Saldo:
${saldoStyle(
saldoCliente(c.id)
)}
</div>

</div>

<br>

<button
class="secondary"
onclick="abrirConta('${c.id}')"
>
Ver conta
</button>

<button
class="danger"
onclick="excluirCliente('${c.id}')"
>
Excluir
</button>

</div>

`)

.join("")

||

"<p>Nenhum cliente cadastrado.</p>";

}


function abrirConta(cid){

contaCliente.value =
cid;

document
.querySelector(
'[data-tab="contas"]'
)
.click();

renderConta();

}


function renderPedidos(){

listaPedidos.innerHTML =

db.pedidos
.slice()
.reverse()

.map(p => {

let c =
cliente(p.clienteId);

return `

<div class="card">

<div class="row">

<b>
${esc(
c?.nome ||
"Cliente removido"
)}
</b>

<span class="pill">
${new Date(p.data)
.toLocaleDateString("pt-BR")}
</span>

</div>

<div>

${esc(p.produto)}

—

${p.qtd}
×

${brl(p.preco)}

=

<b>
${brl(p.total)}
</b>

</div>

<br>

<button
class="danger"
onclick="excluirPedido('${p.id}')"
>
Excluir
</button>

</div>

`;

})

.join("")

||

"<p>Nenhum pedido.</p>";

}


function contaHTML(cid){

let c =
cliente(cid);

if(!c)

return "<p>Selecione um cliente.</p>";


let ps =
db.pedidos
.filter(
p => p.clienteId === cid
);


let pays =
db.pagamentos
.filter(
p => p.clienteId === cid
);


let compras =
ps.reduce(
(a,p) => a + p.total,
0
);


let pagamentos =
pays.reduce(
(a,p) => a + p.valor,
0
);


let saldo =
compras - pagamentos;


return `

<div class="card">

<h2>
Conta de ${esc(c.nome)}
</h2>

<table>

<thead>

<tr>

<th>Data</th>

<th>Descrição</th>

<th>Valor</th>

</tr>

</thead>

<tbody>

${ps.map(p => `

<tr>

<td>
${new Date(p.data)
.toLocaleDateString("pt-BR")}
</td>

<td>
${esc(p.produto)}
(${p.qtd}x)
</td>

<td>
${brl(p.total)}
</td>

</tr>

`).join("")}


${pays.map(p => `

<tr>

<td>
${new Date(p.data)
.toLocaleDateString("pt-BR")}
</td>

<td>
<b>Pagamento</b>
</td>

<td>
- ${brl(p.valor)}
</td>

</tr>

`).join("")}

</tbody>

</table>


<div class="card">

<div>
Total de compras:
<b>
${brl(compras)}
</b>
</div>

<div>
Total pago:
<b>
${brl(pagamentos)}
</b>
</div>

<div style="margin-top:8px">

SALDO FINAL:

<span
class="${
saldo > 0.005
?
"debt"
:
"ok"
}"
>

<b>
${brl(saldo)}
</b>

</span>

</div>

</div>

</div>

`;

}


function renderConta(){

contaResultado.innerHTML =
contaHTML(
contaCliente.value
);

}


function imprimirConta(){

if(!contaCliente.value){

alert(
"Selecione um cliente."
);

return;

}

let old =
document.title;

document.title =
"Conta - " +
cliente(
contaCliente.value
).nome;

window.print();

document.title =
old;

}


function renderRelatorio(){

let t =
rTipo.value;

let cid =
rCliente.value;


if(t === "conta"){

relatorioResultado.innerHTML =
contaHTML(cid);

}


else if(t === "clientes"){

let rows =
db.clientes
.map(c => {

let compras =
totalCliente(c.id);

let pago =
pagoCliente(c.id);

let saldo =
compras - pago;

return `

<tr>

<td>
${esc(c.nome)}
</td>

<td>
${brl(compras)}
</td>

<td>
${brl(pago)}
</td>

<td>
${saldoStyle(saldo)}
</td>

</tr>

`;

})

.join("");


let total =
db.pedidos
.reduce(
(a,p) => a + p.total,
0
);


let pag =
db.pagamentos
.reduce(
(a,p) => a + p.valor,
0
);


relatorioResultado.innerHTML = `

<h2>
👥 Relatório de todos os clientes
</h2>

<table>

<thead>

<tr>

<th>Cliente</th>

<th>Total comprado</th>

<th>Total pago</th>

<th>A receber</th>

</tr>

</thead>

<tbody>

${
rows ||

'<tr><td colspan="4">Nenhum cliente cadastrado.</td></tr>'
}

</tbody>

</table>


<div class="report-total">

<div>
Total vendido:
<b>
${brl(total)}
</b>
</div>

<div>
Total recebido:
<b>
${brl(pag)}
</b>
</div>

<div>
A receber:
<b>
${brl(total-pag)}
</b>
</div>

</div>

`;

}


else if(t === "pedidos"){

let ps =
db.pedidos
.filter(
p =>
!cid ||
p.clienteId === cid
);


let total =
ps.reduce(
(a,p) => a + p.total,
0
);


relatorioResultado.innerHTML = `

<h2>
Relatório de pedidos
</h2>

<table>

<tr>

<th>Data</th>

<th>Cliente</th>

<th>Produto</th>

<th>Qtd.</th>

<th>Total</th>

</tr>

${

ps.map(p => `

<tr>

<td>
${new Date(p.data)
.toLocaleDateString("pt-BR")}
</td>

<td>
${esc(
cliente(p.clienteId)?.nome || ""
)}
</td>

<td>
${esc(p.produto)}
</td>

<td>
${p.qtd}
</td>

<td>
${brl(p.total)}
</td>

</tr>

`).join("")

||

'<tr><td colspan="5">Nenhum pedido.</td></tr>'

}

</table>

<h3>
Total:
${brl(total)}
</h3>

`;

}


else{

let total =
db.pedidos
.reduce(
(a,p) => a + p.total,
0
);


let pag =
db.pagamentos
.reduce(
(a,p) => a + p.valor,
0
);


relatorioResultado.innerHTML = `

<h2>
📊 Resumo geral
</h2>

<div class="grid">

<div class="card">

<div class="small">
Total de vendas
</div>

<div class="total">
${db.pedidos.length}
</div>

</div>


<div class="card">

<div class="small">
Valor vendido
</div>

<div class="total">
${brl(total)}
</div>

</div>


<div class="card">

<div class="small">
Valor recebido
</div>

<div class="total">
${brl(pag)}
</div>

</div>


<div class="card">

<div class="small">
A receber
</div>

<div class="total">
${brl(total-pag)}
</div>

</div>

</div>

`;

}

}


function salvarEstoque(){

let prod =
eProduto.value;

if(!prod)
return;

db.estoque[prod] = {

qtd:
Number(eQtd.value) || 0,

min:
Number(eMin.value) || 0

};

save();

}


function renderEstoque(){

estoqueLista.innerHTML =

PRODUTOS
.map(([p,pre]) => {

let e =
db.estoque[p] ||
{
qtd:0,
min:3
};

return `

<div class="row card">

<div>

<b>
${esc(p)}
</b>

<div class="small">
Preço:
${brl(pre)}
</div>

</div>

<div>

${
e.qtd <= e.min

?

'<span class="warn">⚠️ Estoque baixo</span>'

:

'<span class="ok">OK</span>'
}

</div>

}


function fillSelects(){

let opts =

db.clientes
.map(c => `

<option value="${c.id}">
${esc(c.nome)}
</option>

`)
.join("");


[pCliente,contaCliente,rCliente]
.forEach(s => {

s.innerHTML =
(
s === rCliente
?
'<option value="">Todos</option>'
:
""
)
+
opts;

});


pProduto.innerHTML =

PRODUTOS
.map(([p,pre]) => `

<option value="${esc(p)}">

${esc(p)}
—
${brl(pre)}

</option>

`)
.join("");


eProduto.innerHTML =

PRODUTOS
.map(([p,pre]) => `

<option value="${esc(p)}">

${esc(p)}

</option>

`)
.join("");


if(pProduto.value){

let x =
PRODUTOS.find(
x => x[0] === pProduto.value
);

pPreco.value =
x?.[1] || 0;

}

}


pProduto.addEventListener(
"change",
() => {

let x =
PRODUTOS.find(
x => x[0] === pProduto.value
);

pPreco.value =
x?.[1] || 0;

atualizarTotalPedido();

}
);


pPreco.addEventListener(
"input",
atualizarTotalPedido
);


document
.querySelectorAll("nav button")
.forEach(b => {

b.onclick = () => {

document
.querySelectorAll("section")
.forEach(
s =>
s.classList.remove("show")
);

document
.getElementById(
b.dataset.tab
)
.classList.add("show");


document
.querySelectorAll("nav button")
.forEach(
x =>
x.classList.remove("active")
);

b.classList.add("active");

renderAll();

};

});


function renderAll(){

fillSelects();

renderClientes();

renderPedidos();

renderConta();

renderEstoque();

renderRelatorio();


let rec =
db.clientes.reduce(
(a,c) =>
a +
Math.max(
0,
saldoCliente(c.id)
),
0
);


kClientes.textContent =
db.clientes.length;


kPedidos.textContent =
db.pedidos.length;


kReceber.textContent =
brl(rec);


kEstoque.textContent =

PRODUTOS.filter(
([p]) =>
(
db.estoque[p]?.qtd ?? 0
)
<=
(
db.estoque[p]?.min ?? 3
)
).length;


homeList.innerHTML =

db.clientes
.slice()
.sort(
(a,b) =>
saldoCliente(b.id)
-
saldoCliente(a.id)
)
.slice(0,10)
.map(c => `

<div class="row">

<span>
${esc(c.nome)}
</span>

<span>
${saldoStyle(
saldoCliente(c.id)
)}
</span>

</div>

`)
.join("")

||

"<p>Cadastre seus clientes para começar.</p>";

}


document
.querySelector(
'[data-tab="inicio"]'
)
.classList.add("active");


renderAll();

atualizarTotalPedido();

</script>

</body>
</html>
