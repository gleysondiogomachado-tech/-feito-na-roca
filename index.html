<script>
/* =========================================================
   CORREÇÃO: QUANTIDADE INDEPENDENTE POR PRODUTO
   ========================================================= */

function criarIdUnicoProduto(produto, indice) {
  return "produto_" + indice;
}

function renderProdutos() {
  const el = document.getElementById("listaProdutos");

  if (!el) return;

  el.innerHTML = produtos.map((p, indice) => {

    const chave = criarIdUnicoProduto(p, indice);
    const quantidade = Number(carrinho[chave] || 0);

    return `
      <div class="product">

        <h3>${esc(p.nome)}</h3>

        <div class="price">
          ${moeda(p.preco)}
        </div>

        <div>
          Estoque disponível: ${p.estoque}
        </div>

        <div class="quantidade">

          <button
            type="button"
            class="btn-qtd"
            data-produto="${indice}"
            data-delta="-1">
            −
          </button>

          <span>${quantidade}</span>

          <button
            type="button"
            class="btn-qtd"
            data-produto="${indice}"
            data-delta="1">
            +
          </button>

        </div>

      </div>
    `;

  }).join("");

  el.querySelectorAll(".btn-qtd").forEach(botao => {

    botao.addEventListener("click", function() {

      const indice = Number(this.dataset.produto);
      const delta = Number(this.dataset.delta);

      alterarQtd(indice, delta);

    });

  });

  atualizarResumo();
}


function alterarQtd(indice, delta) {

  indice = Number(indice);

  const produto = produtos[indice];

  if (!produto) return;

  const chave = criarIdUnicoProduto(produto, indice);

  const atual = Number(carrinho[chave] || 0);

  let novaQuantidade = atual + delta;

  if (novaQuantidade < 0) {
    novaQuantidade = 0;
  }

  const estoque = Number(produto.estoque || 0);

  if (novaQuantidade > estoque) {

    alert(
      "Você só tem " +
      estoque +
      " unidade(s) de " +
      produto.nome +
      " em estoque."
    );

    novaQuantidade = estoque;
  }

  carrinho[chave] = novaQuantidade;

  renderProdutos();
}
</script>
