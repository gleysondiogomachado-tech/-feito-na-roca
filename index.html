<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6b3f">
<title>Feito na Roça</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f1e8;
  color:#263126
}

header{
  background:#2f6b3f;
  color:#fff;
  padding:18px 16px;
  position:sticky;
  top:0;
  z-index:5
}

header h1{
  margin:0;
  font-size:24px
}

header small{
  opacity:.9
}

nav{
  display:flex;
  gap:7px;
  overflow:auto;
  padding:10px;
  background:#fff;
  position:sticky;
  top:73px;
  z-index:4;
  border-bottom:1px solid #ddd
}

nav button{
  border:0;
  background:#e8efe8;
  color:#285b34;
  padding:10px 12px;
  border-radius:10px;
  font-weight:bold;
  white-space:nowrap
}

nav button.active{
  background:#2f6b3f;
  color:white
}

main{
  max-width:1000px;
  margin:auto;
  padding:14px
}

section{
  display:none
}

.show{
  display:block
}

.card{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin:10px 0;
  box-shadow:0 2px 8px #00000012
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px
}

input,select,textarea{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
  background:#fff
}

label{
  font-size:13px;
  font-weight:bold;
  display:block;
  margin:8px 0 5px
}

button.primary,.primary{
  background:#2f6b3f;
  color:white;
  border:0;
  border-radius:9px;
  padding:11px 14px;
  font-weight:bold
}

button.danger{
  background:#b3261e;
  color:#fff;
  border:0;
  border-radius:8px;
  padding:8px
}

button.secondary{
  background:#eee;
  border:0;
  border-radius:8px;
  padding:9px
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px
}

th,td{
  padding:9px;
  border-bottom:1px solid #ddd;
  text-align:left
}

th{
  background:#f1f4f0
}

.total{
  font-size:22px;
  font-weight:bold;
  color:#2f6b3f
}

.warn{
  color:#a35a00;
  font-weight:bold
}

.debt{
  color:#b3261e;
  font-weight:bold
}

.ok{
  color:#2f6b3f;
  font-weight:bold
}

.row{
  display:flex;
  gap:8px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap
}

.report-total{
  background:#f1f4f0;
  border-radius:12px;
  padding:14px;
  margin-top:12px
}

.report-total div{
  margin:6px 0
}

.small{
  font-size:13px;
  color:#666
}

.pill{
  padding:4px 8px;
  border-radius:20px;
  background:#eee;
  font-size:12px
}

/* =========================
   PRODUTOS DO PEDIDO
   ========================= */

.produtos-pedido{
  display:flex;
  flex-direction:column;
  gap:9px;
  margin-top:12px
}

.produto-item{
  display:grid;
  grid-template-columns:minmax(0,1fr) 48px 74px 48px;
  gap:7px;
  align-items:center;
  border:1px solid #e1e5e1;
  border-radius:12px;
  padding:9px;
  background:#fff
}

.produto-info{
  min-width:0
}

.produto-nome{
  font-weight:bold;
  font-size:15px;
  line-height:1.25
}

.produto-preco{
  color:#2f6b3f;
  font-size:13px;
  margin-top:4px;
  font-weight:bold
}

.qty-btn{
  width:48px;
  height:48px;
  border:0;
  border-radius:10px;
  background:#e8efe8;
  color:#285b34;
  font-size:28px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center
}

.qty-input{
  width:74px;
  height:48px;
  padding:6px;
  text-align:center;
  font-size:19px;
  font-weight:bold
}

.item-total{
  grid-column:1 / -1;
  text-align:right;
  font-weight:bold;
  color:#263126;
  padding-right:3px
}

.total-pedido{
  background:#f1f4f0;
  border-radius:12px;
  padding:16px;
  margin-top:14px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#2f6b3f
}

.limpar-pedido{
  background:#fbeaea;
  color:#b3261e;
  border:0;
  border-radius:9px;
  padding:9px 12px;
  font-weight:bold
}

.observacoes{
  margin-top:12px
}

@media(max-width:520px){

  .produto-item{
    grid-template-columns:minmax(0,1fr) 43px 62px 43px;
    gap:5px;
    padding:8px
  }

  .qty-btn{
    width:43px;
    height:43px;
    font-size:25px
  }

  .qty-input{
    width:62px;
    height:43px;
    font-size:18px
  }

  .produto-nome{
    font-size:14px
  }

}

@media print{

  nav,header,.no-print{
    display:none!important
  }

  section{
    display:none
  }

  .print-area{
    display:block!important
  }

  .card{
    box-shadow:none
  }

}
</style>
</head>

<body>

<header>
<h1>🌾 Feito na Roça</h1>
<small>Clientes • Pedidos • Contas • Estoque • Relatórios</small>
</header>

<nav id="nav">

<button data-tab="inicio">
Início
</button>

<button data-tab="clientes">
Clientes
</button>

<button data-tab="pedidos">
Pedidos
</button>

<button data-tab="contas">
Contas
</button>

<button data-tab="estoque">
Estoque
</button>

<button data-tab="relatorios">
Relatórios
</button>

</nav>

<main>

<!-- =========================
     INÍCIO
     ========================= -->

<section id="inicio" class="show">

<div class="grid">

<div class="card">
<div class="small">Clientes</div>
<div class="total" id="kClientes">0</div>
</div>

<div class="card">
<div class="small">Pedidos</div>
<div class="total" id="kPedidos">0</div>
</div>

<div class="card">
<div class="small">A receber</div>
<div class="total" id="kReceber">R$ 0,00</div>
</div>

<div class="card">
<div class="small">Estoque baixo</div>
<div class="total" id="kEstoque">0</div>
</div>

</div>

<div class="card">
<h3>Resumo</h3>
<div id="homeList"></div>
</div>

</section>


<!-- =========================
     CLIENTES
     ========================= -->

<section id="clientes">

<div class="card">

<h2>Clientes</h2>

<div class="grid">

<div>
<label>Nome</label>
<input id="cNome" placeholder="Nome do cliente">
</div>

<div>
<label>Telefone</label>
<input id="cTel" placeholder="(00) 00000-0000">
</div>

<div>
<label>Observação</label>
<input id="cObs" placeholder="Observação">
</div>

</div>

<br>

<button class="primary" onclick="addCliente()">
Cadastrar cliente
</button>

</div>

<div class="card">

<input
id="buscaCliente"
oninput="renderClientes()"
placeholder="🔎 Procurar cliente"
>

<div id="listaClientes"></div>

</div>

</section>


<!-- =========================
     PEDIDOS
     ========================= -->

<section id="pedidos">

<div class="card">

<h2>Novo pedido</h2>

<label>Cliente</label>

<select id="pCliente">
</select>


<div class="row" style="margin-top:18px">

<h3 style="margin:0">
Produtos
</h3>

<button
class="limpar-pedido"
type="button"
onclick="limparPedidoAtual()"
>
Limpar quantidades
</button>

</div>


<div
id="produtosPedido"
class="produtos-pedido"
>
</div>


<div
id="totalPedido"
class="total-pedido"
>
Total do pedido: R$ 0,00
</div>


<div class="observacoes">

<label>Observações do pedido</label>

<textarea
id="pObservacao"
rows="3"
placeholder="Ex.: entregar à tarde, separar queijo fresco..."
></textarea>

</div>

<br>

<button
class="primary"
style="width:100%;font-size:17px;padding:14px"
onclick="addPedido()"
>
✓ Lançar pedido completo
</button>

</div>


<div class="card">

<h3>Pedidos</h3>

<div id="listaPedidos"></div>

</div>

</section>


<!-- =========================
     CONTAS
     ========================= -->

<section id="contas">

<div class="card">

<h2>Conta do cliente</h2>

<div class="grid">

<div>

<label>Cliente</label>

<select
id="contaCliente"
onchange="renderConta()"
></select>

</div>

<div>

<label>Pagamento</label>

<input
id="pagValor"
type="number"
step="0.01"
min="0"
>

</div>

</div>

<br>

<button
class="primary"
onclick="registrarPagamento()"
>
Registrar pagamento
</button>

<button
class="secondary"
onclick="imprimirConta()"
>
Imprimir conta
</button>

</div>

<div id="contaResultado"></div>

</section>


<!-- =========================
     ESTOQUE
     ========================= -->

<section id="estoque">

<div class="card">

<h2>Estoque</h2>

<div class="grid">

<div>

<label>Produto</label>

<select id="eProduto"></select>

</div>

<div>

<label>Quantidade atual</label>

<input
id="eQtd"
type="number"
step="0.01"
min="0"
>

</div>

<div>

<label>Estoque mínimo</label>

<input
id="eMin"
type="number"
step="0.01"
min="0"
value="3"
>

</div>

</div>

<br>

<button
class="primary"
onclick="salvarEstoque()"
>
Salvar estoque
</button>

</div>

<div
class="card"
id="estoqueLista"
></div>

</section>


<!-- =========================
     RELATÓRIOS
     ========================= -->

<section id="relatorios">

<div class="card no-print">

<h2>Relatórios</h2>

<div class="grid">

<div>

<label>Cliente</label>

<select
id="rCliente"
onchange="renderRelatorio()"
></select>

</div>

<div>

<label>Tipo</label>

<select
id="rTipo"
onchange="renderRelatorio()"
>

<option value="conta">
Conta do cliente
</option>

<option value="clientes">
Todos os clientes
</option>

<option value="pedidos">
Pedidos
</option>

<option value="geral">
Resumo geral
</option>

</select>

</div>

</div>

<br>

<button
class="primary"
onclick="window.print()"
>
Imprimir / salvar PDF
</button>

</div>

<div
class="card print-area"
id="relatorioResultado"
></div>

</section>

</main>


<script>

/* =========================================================
   PRODUTOS
   ========================================================= */

const PRODUTOS = [

["Queijo fresco",40],

["Queijo curado",45],

["Requeijão duro",55],

["Pão de queijo pequeno (1 kg)",28],

["Pão de queijo grande (1 kg)",27],

["Rosca caseira",12],

["Doce de leite caseiro 200g",12],

["Doce de leite 500g",30],

["Muçarela",50]

];


/* =========================================================
   BANCO DE DADOS
   IMPORTANTE:
   A MESMA CHAVE É MANTIDA PARA NÃO PERDER OS DADOS.
   ========================================================= */

const KEY = "feitoNaRoca_v2";

let db;

try{

  db = JSON.parse(
    localStorage.getItem(KEY) ||
    '{"clientes":[],"pedidos":[],"pagamentos":[],"estoque":{}}'
  );

}catch(e){

  db = {
    clientes:[],
    pedidos:[],
    pagamentos:[],
    estoque:{}
  };

}


/* =========================================================
   RASCUNHO DO PEDIDO ATUAL
   CADA PRODUTO TEM SUA PRÓPRIA QUANTIDADE.
   ========================================================= */

let pedidoAtual = {};


/* =========================================================
   FUNÇÕES BÁSICAS
   ========================================================= */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(db)
  );

  renderAll();

}


function brl(v){

  return (Number(v)||0).toLocaleString(
    "pt-BR",
    {
      style:"currency",
      currency:"BRL"
    }
  );

}


function id(){

  return Date.now() +
  Math.random()
  .toString(16)
  .slice(2);

}


function esc(s){

  return String(s ?? "")
  .replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


function cliente(cid){

  return db.clientes.find(
    c => c.id === cid
  );

}


/* =========================================================
   COMPATIBILIDADE
   Aceita pedidos antigos e pedidos novos.
   ========================================================= */

function itensDoPedido(p){

  if(
    Array.isArray(p.itens)
  ){

    return p.itens;

  }

  return [{

    produto:p.produto,

    qtd:Number(p.qtd)||0,

    preco:Number(p.preco)||0,

    total:
      Number(p.total) ||
      (
        (Number(p.qtd)||0) *
        (Number(p.preco)||0)
      )

  }];

}


function totalDoPedido(p){

  return itensDoPedido(p)
  .reduce(
    (a,i) =>
      a +
      (
        Number(i.total) ||
        (
          (Number(i.qtd)||0) *
          (Number(i.preco)||0)
        )
      ),
    0
  );

}


function totalCliente(cid){

  return db.pedidos

  .filter(
    p => p.clienteId === cid
  )

  .reduce(
    (a,p) =>
      a + totalDoPedido(p),
    0
  );

}


function pagoCliente(cid){

  return db.pagamentos

  .filter(
    p => p.clienteId === cid
  )

  .reduce(
    (a,p) =>
      a + Number(p.valor||0),
    0
  );

}


function saldoCliente(cid){

  return totalCliente(cid) -
  pagoCliente(cid);

}


/* =========================================================
   CLIENTES
   ========================================================= */

function addCliente(){

  let nome =
    document.getElementById("cNome")
    .value
    .trim();

  if(!nome){

    alert("Informe o nome.");

    return;

  }

  db.clientes.push({

    id:id(),

    nome:nome,

    tel:
      document
      .getElementById("cTel")
      .value
      .trim(),

    obs:
      document
      .getElementById("cObs")
      .value
      .trim(),

    criado:
      new Date().toISOString()

  });

  document.getElementById("cNome").value="";
  document.getElementById("cTel").value="";
  document.getElementById("cObs").value="";

  save();

}


function excluirCliente(cid){

  if(
    !confirm(
      "Excluir cliente e manter os lançamentos?"
    )
  )return;

  db.clientes =
    db.clientes.filter(
      c => c.id !== cid
    );

  save();

}


/* =========================================================
   PEDIDO — QUANTIDADE INDEPENDENTE
   ========================================================= */

function iniciarPedidoAtual(){

  pedidoAtual = {};

  PRODUTOS.forEach(
    ([produto]) => {
      pedidoAtual[produto] = 0;
    }
  );

}


function quantidadeProduto(produto){

  return Number(
    pedidoAtual[produto] || 0
  );

}


function alterarProduto(produto,delta){

  let atual =
    quantidadeProduto(produto);

  atual += delta;

  if(atual < 0)
    atual = 0;

  pedidoAtual[produto] = atual;

  renderProdutosPedido();

}


function definirQuantidade(produto,valor){

  let q =
    Math.floor(
      Number(valor)
    );

  if(!Number.isFinite(q) || q < 0)
    q = 0;

  pedidoAtual[produto] = q;

  renderProdutosPedido();

}


function totalAtualPedido(){

  return PRODUTOS.reduce(
    (total,[produto,preco]) => {

      return total +
        (
          quantidadeProduto(produto) *
          preco
        );

    },
    0
  );

}


function renderProdutosPedido(){

  const el =
    document.getElementById(
      "produtosPedido"
    );

  if(!el)return;

  el.innerHTML =
    PRODUTOS.map(
      ([produto,preco]) => {

        let q =
          quantidadeProduto(produto);

        let subtotal =
          q * preco;

        return `

        <div class="produto-item">

          <div class="produto-info">

            <div class="produto-nome">
              ${esc(produto)}
            </div>

            <div class="produto-preco">
              ${brl(preco)}
            </div>

          </div>


          <button
            type="button"
            class="qty-btn"
            aria-label="Diminuir ${esc(produto)}"
            onclick='alterarProduto(${JSON.stringify(produto)},-1)'
          >
            −
          </button>


          <input
            class="qty-input"
            type="number"
            min="0"
            step="1"
            value="${q}"
            aria-label="Quantidade de ${esc(produto)}"
            onchange='definirQuantidade(${JSON.stringify(produto)},this.value)'
            oninput='definirQuantidade(${JSON.stringify(produto)},this.value)'
          >


          <button
            type="button"
            class="qty-btn"
            aria-label="Aumentar ${esc(produto)}"
            onclick='alterarProduto(${JSON.stringify(produto)},1)'
          >
            +
          </button>


          <div class="item-total">

            ${q > 0
              ? `${q} × ${brl(preco)} = <b>${brl(subtotal)}</b>`
              : `Subtotal: ${brl(0)}`
            }

          </div>

        </div>

        `;

      }
    )
    .join("");


  document.getElementById(
    "totalPedido"
  ).textContent =
    "Total do pedido: " +
    brl(totalAtualPedido());

}


function limparPedidoAtual(){

  iniciarPedidoAtual();

  renderProdutosPedido();

}


function addPedido(){

  const cid =
    document.getElementById(
      "pCliente"
    ).value;

  if(!cid){

    alert(
      "Selecione o cliente."
    );

    return;

  }


  const itens = [];


  PRODUTOS.forEach(
    ([produto,preco]) => {

      const q =
        quantidadeProduto(produto);

      if(q > 0){

        itens.push({

          produto:produto,

          qtd:q,

          preco:preco,

          total:q * preco

        });

      }

    }
  );


  if(itens.length === 0){

    alert(
      "Escolha pelo menos um produto."
    );

    return;

  }


  const total =
    itens.reduce(
      (a,i) =>
        a + i.total,
      0
    );


  const observacao =
    document.getElementById(
      "pObservacao"
    ).value.trim();


  /*
    UM ÚNICO PEDIDO
    COM VÁRIOS PRODUTOS DENTRO DE "itens".
  */

  db.pedidos.push({

    id:id(),

    clienteId:cid,

    itens:itens,

    total:total,

    observacao:observacao,

    data:
      new Date().toISOString()

  });


  /*
    NÃO mexemos em clientes,
    pagamentos ou pedidos antigos.
  */

  save();


  alert(
    "Pedido completo lançado!\n\nTotal: " +
    brl(total)
  );


  iniciarPedidoAtual();

  document.getElementById(
    "pObservacao"
  ).value="";

  renderProdutosPedido();

}


/* =========================================================
   PEDIDOS
   ========================================================= */

function excluirPedido(pid){

  if(
    !confirm(
      "Excluir este pedido?"
    )
  )return;

  db.pedidos =
    db.pedidos.filter(
      p => p.id !== pid
    );

  save();

}


function textoItensPedido(p){

  return itensDoPedido(p)
  .map(i =>
    `${esc(i.produto)} (${i.qtd}x)`
  )
  .join("<br>");

}


function renderPedidos(){

  const el =
    document.getElementById(
      "listaPedidos"
    );

  if(!el)return;


  el.innerHTML =

    db.pedidos
    .slice()
    .reverse()
    .map(p => {

      let c =
        cliente(p.clienteId);

      let itens =
        itensDoPedido(p);

      let total =
        totalDoPedido(p);


      return `

      <div class="card">

        <div class="row">

          <b>
            ${esc(
              c?.nome ||
              "Cliente removido"
            )}
          </b>

          <span class="pill">
            ${new Date(p.data)
              .toLocaleDateString(
                "pt-BR"
              )}
          </span>

        </div>


        <div style="margin-top:10px">

          ${itens.map(i => `

            <div
              style="
                padding:5px 0;
                border-bottom:1px solid #eee
              "
            >

              ${esc(i.produto)}

              —
              ${i.qtd} ×
              ${brl(i.preco)}

              =
              <b>
                ${brl(
                  Number(i.total) ||
                  (
                    i.qtd *
                    i.preco
                  )
                )}
              </b>

            </div>

          `).join("")}

        </div>


        ${
          p.observacao
          ?
          `
          <div
            class="small"
            style="margin-top:8px"
          >
            📝 ${esc(p.observacao)}
          </div>
          `
          :
          ""
        }


        <div
          style="
            margin-top:10px;
            font-size:18px;
            font-weight:bold;
            color:#2f6b3f
          "
        >
          Total:
          ${brl(total)}
        </div>


        <br>

        <button
          class="danger"
          onclick="excluirPedido('${p.id}')"
        >
          Excluir
        </button>

      </div>

      `;

    })
    .join("")

    ||

    "<p>Nenhum pedido.</p>";

}


/* =========================================================
   PAGAMENTOS
   ========================================================= */

function registrarPagamento(){

  const cid =
    document.getElementById(
      "contaCliente"
    ).value;

  const v =
    Number(
      document.getElementById(
        "pagValor"
      ).value
    );


  if(!cid || v <= 0){

    alert(
      "Informe cliente e valor."
    );

    return;

  }


  db.pagamentos.push({

    id:id(),

    clienteId:cid,

    valor:v,

    data:
      new Date().toISOString()

  });


  document.getElementById(
    "pagValor"
  ).value="";


  save();

  renderConta();

}


/* =========================================================
   CONTAS
   ========================================================= */

function saldoStyle(s){

  return s > 0.005

  ?

  `<span class="debt">
    ${brl(s)}
  </span>`

  :

  `<span class="ok">
    ${brl(s)}
  </span>`;

}


function renderClientes(){

  const busca =
    document.getElementById(
      "buscaCliente"
    );

  const q =
    (busca?.value || "")
    .toLowerCase();


  document.getElementById(
    "listaClientes"
  ).innerHTML =

    db.clientes

    .filter(
      c =>
        c.nome
        .toLowerCase()
        .includes(q)
    )

    .map(c => `

      <div class="card">

        <div class="row">

          <div>

            <b>
              ${esc(c.nome)}
            </b>

            <div class="small">
              ${esc(c.tel || "")}
            </div>

          </div>

          <div>
            Saldo:
            ${saldoStyle(
              saldoCliente(c.id)
            )}
          </div>

        </div>

        <br>

        <button
          class="secondary"
          onclick="abrirConta('${c.id}')"
        >
          Ver conta
        </button>

        <button
          class="danger"
          onclick="excluirCliente('${c.id}')"
        >
          Excluir
        </button>

      </div>

    `)

    .join("")

    ||

    "<p>Nenhum cliente cadastrado.</p>";

}


function abrirConta(cid){

  document.getElementById(
    "contaCliente"
  ).value = cid;


  document
    .querySelector(
      '[data-tab="contas"]'
    )
    .click();


  renderConta();

}


function contaHTML(cid){

  const c =
    cliente(cid);

  if(!c){

    return `
      <div class="card">
        <p>Selecione um cliente.</p>
      </div>
    `;

  }


  const ps =
    db.pedidos
    .filter(
      p => p.clienteId === cid
    );


  const pays =
    db.pagamentos
    .filter(
      p => p.clienteId === cid
    );


  const compras =
    ps.reduce(
      (a,p) =>
        a + totalDoPedido(p),
      0
    );


  const pagamentos =
    pays.reduce(
      (a,p) =>
        a + Number(p.valor || 0),
      0
    );


  const saldo =
    compras - pagamentos;


  return `

  <div class="card">

    <h2>
      Conta de ${esc(c.nome)}
    </h2>


    <table>

      <thead>

        <tr>

          <th>Data</th>

          <th>Descrição</th>

          <th>Valor</th>

        </tr>

      </thead>


      <tbody>

        ${ps.map(p => `

          <tr>

            <td>
              ${new Date(p.data)
                .toLocaleDateString(
                  "pt-BR"
                )}
            </td>

            <td>

              ${itensDoPedido(p)
                .map(i =>
                  `${esc(i.produto)}
                   (${i.qtd}x) — ${brl(
                     Number(i.total) ||
                     i.qtd * i.preco
                   )}`
                )
                .join("<br>")}

              ${
                p.observacao
                ?
                `<div class="small">
                  📝 ${esc(p.observacao)}
                </div>`
                :
                ""
              }

            </td>

            <td>
              <b>
                ${brl(
                  totalDoPedido(p)
                )}
              </b>
            </td>

          </tr>

        `).join("")}


        ${pays.map(p => `

          <tr>

            <td>
              ${new Date(p.data)
                .toLocaleDateString(
                  "pt-BR"
                )}
            </td>

            <td>
              <b>Pagamento</b>
            </td>

            <td>
              - ${brl(p.valor)}
            </td>

          </tr>

        `).join("")}

      </tbody>

    </table>


    <div class="card">

      <div>
        Total de compras:
        <b>
          ${brl(compras)}
        </b>
      </div>

      <div>
        Total pago:
        <b>
          ${brl(pagamentos)}
        </b>
      </div>

      <div style="margin-top:8px">

        SALDO FINAL:

        <span
          class="${
            saldo > 0.005
            ? "debt"
            : "ok"
          }"
        >

          <b>
            ${brl(saldo)}
          </b>

        </span>

      </div>

    </div>

  </div>

  `;

}


function renderConta(){

  const el =
    document.getElementById(
      "contaResultado"
    );

  if(!el)return;

  el.innerHTML =
    contaHTML(
      document.getElementById(
        "contaCliente"
      ).value
    );

}


function imprimirConta(){

  const cid =
    document.getElementById(
      "contaCliente"
    ).value;


  if(!cid){

    alert(
      "Selecione um cliente."
    );

    return;

  }


  const c =
    cliente(cid);


  const old =
    document.title;


  document.title =
    "Conta - " +
    c.nome;


  window.print();


  document.title =
    old;

}


/* =========================================================
   RELATÓRIOS
   ========================================================= */

function renderRelatorio(){

  const tipo =
    document.getElementById(
      "rTipo"
    ).value;


  const cid =
    document.getElementById(
      "rCliente"
    ).value;


  const el =
    document.getElementById(
      "relatorioResultado"
    );


  if(tipo === "conta"){

    el.innerHTML =
      contaHTML(cid);

    return;

  }


  if(tipo === "clientes"){

    const rows =
      db.clientes
      .map(c => {

        const compras =
          totalCliente(c.id);

        const pago =
          pagoCliente(c.id);

        const saldo =
          compras - pago;


        return `

        <tr>

          <td>
            ${esc(c.nome)}
          </td>

          <td>
            ${brl(compras)}
          </td>

          <td>
            ${brl(pago)}
          </td>

          <td>
            ${saldoStyle(saldo)}
          </td>

        </tr>

        `;

      })
      .join("");


    const total =
      db.pedidos
      .reduce(
        (a,p) =>
          a + totalDoPedido(p),
        0
      );


    const pag =
      db.pagamentos
      .reduce(
        (a,p) =>
          a + Number(p.valor || 0),
        0
      );


    el.innerHTML = `

      <h2>
        👥 Relatório de todos os clientes
      </h2>

      <table>

        <thead>

          <tr>

            <th>Cliente</th>

            <th>Total comprado</th>

            <th>Total pago</th>

            <th>A receber</th>

          </tr>

        </thead>

        <tbody>

          ${
            rows ||

            '<tr><td colspan="4">Nenhum cliente cadastrado.</td></tr>'
          }

        </tbody>

      </table>


      <div class="report-total">

        <div>
          Total vendido:
          <b>
            ${brl(total)}
          </b>
        </div>

        <div>
          Total recebido:
          <b>
            ${brl(pag)}
          </b>
        </div>

        <div>
          A receber:
          <b>
            ${brl(total-pag)}
          </b>
        </div>

      </div>

    `;

    return;

  }


  if(tipo === "pedidos"){

    const ps =
      db.pedidos
      .filter(
        p =>
          !cid ||
          p.clienteId === cid
      );


    const total =
      ps.reduce(
        (a,p) =>
          a + totalDoPedido(p),
        0
      );


    el.innerHTML = `

      <h2>
        Relatório de pedidos
      </h2>

      <table>

        <tr>

          <th>Data</th>

          <th>Cliente</th>

          <th>Produtos</th>

          <th>Total</th>

        </tr>

        ${

          ps.map(p => `

            <tr>

              <td>
                ${new Date(p.data)
                  .toLocaleDateString(
                    "pt-BR"
                  )}
              </td>

              <td>
                ${esc(
                  cliente(
                    p.clienteId
                  )?.nome || ""
                )}
              </td>

              <td>

                ${itensDoPedido(p)
                  .map(i =>
                    `${esc(i.produto)}
                    (${i.qtd}x)`
                  )
                  .join("<br>")}

              </td>

              <td>
                <b>
                  ${brl(
                    totalDoPedido(p)
                  )}
                </b>
              </td>

            </tr>

          `).join("")

          ||

          '<tr><td colspan="4">Nenhum pedido.</td></tr>'

        }

      </table>


      <h3>
        Total:
        ${brl(total)}
      </h3>

    `;

    return;

  }


  const total =
    db.pedidos
    .reduce(
      (a,p) =>
        a + totalDoPedido(p),
      0
    );


  const pag =
    db.pagamentos
    .reduce(
      (a,p) =>
        a + Number(p.valor || 0),
      0
    );


  el.innerHTML = `

    <h2>
      📊 Resumo geral
    </h2>

    <div class="grid">

      <div class="card">

        <div class="small">
          Total de pedidos
        </div>

        <div class="total">
          ${db.pedidos.length}
        </div>

      </div>


      <div class="card">

        <div class="small">
          Valor vendido
        </div>

        <div class="total">
          ${brl(total)}
        </div>

      </div>


      <div class="card">

        <div class="small">
          Valor recebido
        </div>

        <div class="total">
          ${brl(pag)}
        </div>

      </div>


      <div class="card">

        <div class="small">
          A receber
        </div>

        <div class="total">
          ${brl(total-pag)}
        </div>

      </div>

    </div>

  `;

}


/* =========================================================
   ESTOQUE
   ========================================================= */

function salvarEstoque(){

  const prod =
    document.getElementById(
      "eProduto"
    ).value;


  if(!prod)return;


  db.estoque[prod] = {

    qtd:
      Number(
        document.getElementById(
          "eQtd"
        ).value
      ) || 0,

    min:
      Number(
        document.getElementById(
          "eMin"
        ).value
      ) || 0

  };


  save();

}


function renderEstoque(){

  const el =
    document.getElementById(
      "estoqueLista"
    );


  el.innerHTML =

    PRODUTOS
    .map(([p,pre]) => {

      const e =
        db.estoque[p] ||
        {
          qtd:0,
          min:3
        };


      return `

      <div class="row card">

        <div>

          <b>
            ${esc(p)}
          </b>

          <div class="small">
            Preço:
            ${brl(pre)}
          </div>

        </div>

        <div>

          ${
            e.qtd <= e.min

            ?

            '<span class="warn">⚠️ Estoque baixo</span>'

            :

            '<span class="ok">OK</span>'
          }

          <br>

          ${e.qtd} un.

        </div>

      </div>

      `;

    })

    .join("");

}


/* =========================================================
   SELECTS
   ========================================================= */

function fillSelects(){

  const pCliente =
    document.getElementById(
      "pCliente"
    );

  const contaCliente =
    document.getElementById(
      "contaCliente"
    );

  const rCliente =
    document.getElementById(
      "rCliente"
    );

  const eProduto =
    document.getElementById(
      "eProduto"
    );


  const clienteAtualPedido =
    pCliente.value;

  const clienteAtualConta =
    contaCliente.value;

  const clienteAtualRelatorio =
    rCliente.value;

  const produtoAtualEstoque =
    eProduto.value;


  const opts =
    db.clientes
    .map(c => `

      <option value="${esc(c.id)}">
        ${esc(c.nome)}
      </option>

    `)
    .join("");


  pCliente.innerHTML =
    opts;


  contaCliente.innerHTML =
    opts;


  rCliente.innerHTML =
    '<option value="">Todos</option>' +
    opts;


  if(
    db.clientes.some(
      c =>
        c.id === clienteAtualPedido
    )
  ){

    pCliente.value =
      clienteAtualPedido;

  }


  if(
    db.clientes.some(
      c =>
        c.id === clienteAtualConta
    )
  ){

    contaCliente.value =
      clienteAtualConta;

  }


  if(
    db.clientes.some(
      c =>
        c.id === clienteAtualRelatorio
    )
  ){

    rCliente.value =
      clienteAtualRelatorio;

  }


  eProduto.innerHTML =

    PRODUTOS
    .map(
      ([p]) => `

        <option value="${esc(p)}">
          ${esc(p)}
        </option>

      `
    )
    .join("");


  if(
    PRODUTOS.some(
      ([p]) =>
        p === produtoAtualEstoque
    )
  ){

    eProduto.value =
      produtoAtualEstoque;

  }

}


/* =========================================================
   NAVEGAÇÃO
   ========================================================= */

document
.querySelectorAll("nav button")
.forEach(button => {

  button.onclick = () => {

    document
    .querySelectorAll("section")
    .forEach(
      s =>
        s.classList.remove(
          "show"
        )
    );


    document
    .getElementById(
      button.dataset.tab
    )
    .classList.add("show");


    document
    .querySelectorAll(
      "nav button"
    )
    .forEach(
      b =>
        b.classList.remove(
          "active"
        )
    );


    button.classList.add(
      "active"
    );


    renderAll();

  };

});


/* =========================================================
   RENDERIZAÇÃO GERAL
   ========================================================= */

function renderAll(){

  fillSelects();

  renderProdutosPedido();

  renderClientes();

  renderPedidos();

  renderConta();

  renderEstoque();

  renderRelatorio();


  const rec =
    db.clientes
    .reduce(
      (a,c) =>
        a +
        Math.max(
          0,
          saldoCliente(c.id)
        ),
      0
    );


  document.getElementById(
    "kClientes"
  ).textContent =
    db.clientes.length;


  document.getElementById(
    "kPedidos"
  ).textContent =
    db.pedidos.length;


  document.getElementById(
    "kReceber"
  ).textContent =
    brl(rec);


  document.getElementById(
    "kEstoque"
  ).textContent =

    PRODUTOS
    .filter(
      ([p]) =>
        (
          db.estoque[p]?.qtd ??
          0
        )
        <=
        (
          db.estoque[p]?.min ??
          3
        )
    )
    .length;


  document.getElementById(
    "homeList"
  ).innerHTML =

    db.clientes

    .slice()

    .sort(
      (a,b) =>
        saldoCliente(b.id) -
        saldoCliente(a.id)
    )

    .slice(0,10)

    .map(c => `

      <div class="row">

        <span>
          ${esc(c.nome)}
        </span>

        <span>
          ${saldoStyle(
            saldoCliente(c.id)
          )}
        </span>

      </div>

    `)

    .join("")

    ||

    "<p>Cadastre seus clientes para começar.</p>";

}


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

iniciarPedidoAtual();


document
.querySelector(
  '[data-tab="inicio"]'
)
.classList.add("active");


renderAll();

</script>
